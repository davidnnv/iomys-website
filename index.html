<!doctype html>
<html lang="mk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111316" />
    <title>IOMYS — Агенција за развој на софтвер</title>
    <meta name="description" content="IOMYS е агенција за развој на софтвер од Скопје. Инженерски градиме дигитални производи за модерни бизниси: веб-страници, веб и мобилни апликации, UI/UX дизајн." />
    <meta property="og:title" content="IOMYS — Software Development Agency" />
    <meta property="og:description" content="Engineering digital products for modern businesses." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before React loads, so there is no flash.
      try {
        var t = localStorage.getItem('iomys-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
